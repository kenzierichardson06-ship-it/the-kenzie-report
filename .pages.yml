media:
  input: images
  output: /images

content:
  - name: articles
    label: Articles
    type: collection
    path: articles
    filename: "{primary}.md"
    view:
      fields: [title, section, featured, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      search: [title, section]
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: section
        label: Section
        type: select
        required: true
        options:
          - Politics
          - Britain
          - Reform
          - Westminster
          - Economy
          - NHS
          - Immigration
          - Opinion
          - Analysis
      - name: image
        label: Featured Image
        type: image
      - name: featured
        label: Feature on homepage
        type: boolean
        default: false
      - name: body
        label: Article
        type: rich-text
        required: true

  - name: breaking
    label: Breaking News
    type: collection
    path: breaking
    filename: "{primary}.md"
    view:
      fields: [title, active, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
      search: [title]
    fields:
      - name: title
        label: Breaking headline
        type: string
        required: true
      - name: active
        label: Show on site
        type: boolean
        default: true
      - name: date
        label: Date and time
        type: date
        required: true
      - name: url
        label: Link (optional)
        type: string
      - name: body
        label: Notes (optional)
        type: rich-text
  - name: polls
    label: Polls
    type: collection
    path: polls
    filename: "{primary}.md"
    view:
      fields: [question, active, date]
      primary: question
      sort: [date, question]
      default:
        sort: date
        order: desc
      search: [question]
    fields:
      - name: question
        label: Poll question
        type: string
        required: true
      - name: active
        label: Show on site
        type: boolean
        default: true
      - name: date
        label: Date
        type: date
        required: true
      - name: option1
        label: Option 1
        type: string
        required: true
      - name: option2
        label: Option 2
        type: string
        required: true
      - name: option3
        label: Option 3
        type: string
      - name: option4
        label: Option 4
        type: string
  - name: debates
    label: Debates
    type: collection
    path: debates
    filename: "{primary}.md"
    view:
      fields: [question, active, date]
      primary: question
      sort: [date, question]
      default:
        sort: date
        order: desc
      search: [question]
    fields:
      - name: question
        label: Debate question
        type: string
        required: true
      - name: active
        label: Show on site
        type: boolean
        default: true
      - name: date
        label: Date
        type: date
        required: true
      - name: intro
        label: Introduction
        type: rich-text
      - name: option1
        label: Option 1
        type: string
        required: true
      - name: option2
        label: Option 2
        type: string
        required: true
      - name: option3
        label: Option 3
        type: string
      - name: option4
        label: Option 4
        type: string
