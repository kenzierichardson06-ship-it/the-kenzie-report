name: Refresh publication feeds

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate sitemap and RSS
        run: python scripts/generate_feeds.py
      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml rss.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh sitemap and RSS feed"
          git push
